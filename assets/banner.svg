<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </linearGradient>
    
    <linearGradient id="glowGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="0" r="1.5" fill="rgba(99, 102, 241, 0.15)" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-pill-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .code-accent {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 14px;
      fill: #38bdf8;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glows (Behind) -->
  <circle cx="200" cy="100" r="160" fill="url(#glowGrad1)" filter="url(#blurFilter)">
    <animate attributeName="cx" values="180;260;180" dur="12s" repeatCount="indefinite" />
    <animate attributeName="cy" values="90;130;90" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="1020" cy="240" r="180" fill="url(#glowGrad2)" filter="url(#blurFilter)">
    <animate attributeName="cx" values="1020;960;1020" dur="14s" repeatCount="indefinite" />
    <animate attributeName="cy" values="240;190;240" dur="11s" repeatCount="indefinite" />
  </circle>

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="360" rx="16" fill="url(#gridPattern)" />

  <!-- Dynamic Network & Flow Nodes in Background -->
  <g opacity="0.45">
    <!-- Flow Line 1 -->
    <path d="M 100 300 Q 350 260 600 320 T 1100 280" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="0;48" dur="4s" repeatCount="indefinite" />
    </path>
    <!-- Flow Line 2 -->
    <path d="M 50 60 Q 400 120 750 50 T 1150 90" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="8,8">
      <animate attributeName="stroke-dashoffset" values="64;0" dur="6s" repeatCount="indefinite" />
    </path>
    
    <!-- Floating Pulse Nodes -->
    <circle cx="350" cy="275" r="4" fill="#38bdf8">
      <animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="320" r="5" fill="#818cf8">
      <animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="880" cy="295" r="4" fill="#c084fc">
      <animate attributeName="r" values="3;6;3" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="750" cy="50" r="4.5" fill="#ec4899">
      <animate attributeName="r" values="3;6;3" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Central Foreground Content Group (Anchored in foreground, never obscured) -->
  <g transform="translate(60, 0)">
    
    <!-- Top Pill / Status Tag -->
    <g transform="translate(0, 52)">
      <rect width="365" height="32" rx="16" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="21" class="code-accent">🚀 TOP AI SDKs &amp; APIs ECOSYSTEM</text>
    </g>

    <!-- Main Title with Gradient fill -->
    <text x="0" y="145" class="title-text" fill="url(#primaryGrad)">Awesome AI SDKs &amp; APIs</text>

    <!-- Subtitle -->
    <text x="0" y="195" class="subtitle-text">Curated Multi-Model Gateways, Frontier Provider SDKs &amp; Agent Frameworks</text>

    <!-- Dynamic Category Feature Pills (Foreground Layer) -->
    <g transform="translate(0, 240)">
      <!-- Pill 1: Model Gateways -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.2" />
        <text x="90" y="24" class="badge-pill-text" text-anchor="middle">⚡ Multi-LLM Gateways</text>
      </g>
      <!-- Pill 2: Agent Frameworks -->
      <g transform="translate(195, 0)">
        <rect width="185" height="38" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#818cf8" stroke-width="1.2" />
        <text x="92" y="24" class="badge-pill-text" text-anchor="middle">🤖 Agent Orchestration</text>
      </g>
      <!-- Pill 3: Production RAG -->
      <g transform="translate(395, 0)">
        <rect width="175" height="38" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#a855f7" stroke-width="1.2" />
        <text x="87" y="24" class="badge-pill-text" text-anchor="middle">📚 Advanced RAG</text>
      </g>
      <!-- Pill 4: Inference Serving -->
      <g transform="translate(585, 0)">
        <rect width="190" height="38" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#ec4899" stroke-width="1.2" />
        <text x="95" y="24" class="badge-pill-text" text-anchor="middle">🔥 High-Speed Inference</text>
      </g>
      <!-- Pill 5: Guardrails -->
      <g transform="translate(790, 0)">
        <rect width="180" height="38" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#10b981" stroke-width="1.2" />
        <text x="90" y="24" class="badge-pill-text" text-anchor="middle">🛡️ Guardrails &amp; Eval</text>
      </g>
    </g>

    <!-- Bottom Metadata Details -->
    <g transform="translate(0, 312)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">
        Updated 2026 • Verified Token Pricing &amp; Limits • GitHub Stars Tracking • Apache 2.0 &amp; MIT Ecosystem
      </text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
</svg>
